  var chart = echarts.init(document.getElementById('chart'), 'dark');
  var COLORS = {category:'#2bbc8a', tag:'#397bdd', post:'#b39b4a'};
  var categories = [
    {name:'分类', itemStyle:{color:COLORS.category}},
    {name:'标签', itemStyle:{color:COLORS.tag}},
    {name:'文章', itemStyle:{color:COLORS.post}}
  ];
  var catIdx = {category:0,tag:1,post:2};
  var nodes = GRAPH.nodes.map(function(n){
    var url = n.url || '';
    if (n.category === 'category') url = '/categories/' + encodeURIComponent(n.name) + '/';
    if (n.category === 'tag') url = '/tags/' + encodeURIComponent(n.name) + '/';
    return {
      id:n.id, name:n.name, category:catIdx[n.category], url:url,
      symbolSize:n.category==='category'?46:n.category==='tag'?28:20,
      itemStyle:{color:COLORS[n.category], shadowBlur: n.category==='post'?10:6, shadowColor:COLORS[n.category]}
    };
  });
  var links = GRAPH.links.map(function(l){
    return {source:l.source,target:l.target,
      lineStyle:{color:l.rel==='category'?'rgba(43,188,138,.4)':'rgba(57,123,221,.35)',width:1.2,curveness:.1}};
  });
  var option = {
    backgroundColor: 'transparent',
    tooltip:{formatter:function(p){ if(p.dataType==='edge')return ''; var t=p.data.name; return '<b style="color:#2bbc8a">'+t+'</b><br><span style="color:#8a908c">'+(p.data.url?'点击查看 →':'无法跳转')+'</span>';}, backgroundColor:'rgba(10,12,15,.95)', borderColor:'#26292b', textStyle:{color:'#e6e9e8', fontFamily:'inherit'}},
    legend:{show:false},
    series:[{
      type:'graph', layout:'force', data:nodes, links:links, categories:categories, roam:true, draggable:true,
      force:{repulsion:220, gravity:.08, edgeLength:[60,150], friction:.12},
      label:{show:true, position:'right', color:'#b8bebc', fontSize:11, fontFamily:'inherit', formatter:function(p){return p.data.name.length>13?p.data.name.slice(0,13)+'…':p.data.name;}},
      emphasis:{focus:'adjacency', lineStyle:{width:3}, label:{show:true, color:'#2bbc8a'}, itemStyle:{shadowBlur:20}},
      lineStyle:{curveness:.1},
      edgeSymbol:['none','arrow'], edgeSymbolSize:4
    }]
  };
  chart.setOption(option);
  // 节点点击：文章/分类/标签跳转对应页面（同标签导航，避免新开空白标签白闪）
  chart.on('click', function(p){ if(p.dataType==='node' && p.data.url){ window.location.href = p.data.url; } });
  window.addEventListener('resize', function(){ chart.resize(); });

  // 过滤按钮
  var buttons = document.querySelectorAll('.controls button[data-filter]');
  buttons.forEach(function(b){
    b.addEventListener('click', function(){
      buttons.forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      var filter = b.getAttribute('data-filter');
      var keepIndex = [], names = new Set();
      GRAPH.nodes.forEach(function(n, i){
        if(filter==='all'){ keepIndex.push(i); }
        else if(filter==='category' && n.category==='category'){ keepIndex.push(i); names.add(n.id); }
        else if(filter==='tag' && n.category==='tag'){ keepIndex.push(i); names.add(n.id); }
        else if(filter==='post' && n.category==='post'){ keepIndex.push(i); names.add(n.id); }
      });
      var kept = nodes.filter(function(_,i){return keepIndex.indexOf(i)>=0;});
      var outLinks = filter==='all' ? links : GRAPH.links.filter(function(l){
        return names.has(l.source)||names.has(l.target);
      }).map(function(l){return {source:l.source,target:l.target,lineStyle:{color:l.rel==='category'?'rgba(43,188,138,.4)':'rgba(57,123,221,.35)',width:1.2,curveness:.1}};});
      chart.setOption({series:[{data:kept, links:outLinks}]});
    });
  });
</script>
